# Dependabot version updates, weekly and grouped (one pull request per ecosystem for minor and patch
# updates; a major update gets its own). Security updates come on their own as soon as an advisory is out,
# once "Dependabot security updates" is on in the repository's settings (Security, Code security).
version: 2
updates:
  # The core workspace. The desktop app (desktop-app/src-tauri) isn't listed: its Cargo.toml needs the
  # sibling Windows, macOS and Linux repositories, which Dependabot can't check out, so its lockfile is
  # updated by hand (cargo update) and checked by cargo audit in CI.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
